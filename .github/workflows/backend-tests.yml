name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: sqlite:///./test-backend-ci.db
      JWT_SECRET: backend-ci-test-secret-key-32-bytes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx

      # The whole suite, not only the release contracts: regressions such as
      # the display crash (#491) were covered by tests that CI never ran.
      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q

  endpoint-budgets-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tribu
          POSTGRES_PASSWORD: tribu
          POSTGRES_DB: tribu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tribu -d tribu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: sqlite:///./test-backend-ci.db
      JWT_SECRET: backend-ci-test-secret-key-32-bytes
      TRIBU_BUDGET_DATABASE_URL: postgresql://tribu:tribu@localhost:5432/tribu

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx

      # Production runs on PostgreSQL; check the heavy endpoints there too.
      - name: Run endpoint budgets on PostgreSQL
        run: PYTHONPATH=backend python -m pytest backend/tests/test_endpoint_budgets.py -q -s
